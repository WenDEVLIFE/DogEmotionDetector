seed: 42

data:
  root: datasets/dog_emotion_classification
  splits: [0.8, 0.1, 0.1]
  batch_size: 32
  image_size: [224, 224]
  num_classes: 5
  class_names: [alert, angry, frown, happy, relax]

model:
  base_model: EfficientNetV2B0
  frozen_layers: 120
  dense_units: 256
  dropout: 0.5
  weight_decay: 0.01

training:
  epochs: 150
  learning_rate: 0.0003
  label_smoothing: 0.1
  early_stopping_patience: 20
  reduce_lr_patience: 8
  reduce_lr_factor: 0.5

export:
  format: tflite
  quantize: false
  output_dir: models
